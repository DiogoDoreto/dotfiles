name: Nix systems
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Nix ${{ matrix.host }}
    runs-on: chungus-nix
    # Defense in depth only. Server-side trust policy is mandatory; see docs.
    if: >-
      github.repository == 'diogo/dotfiles' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'diogo/dotfiles')
    strategy:
      fail-fast: false
      matrix:
        host: [lapdog, mini, chungus]
    env:
      HOST: ${{ matrix.host }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      # Local mirror of Forgejo actions/checkout v4.4.0 (node20), pinned.
      - uses: https://git.local.doreto.com.br/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: diogo/dotfiles
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
      - name: Check immutable host flake
        run: nix flake check "./hosts/$HOST/" --no-update-lock-file --no-write-lock-file
      - name: Build and retain system
        id: system
        run: |
          set -euo pipefail
          case "$HOST" in
            mini) output=dogdot ;;
            lapdog|chungus) output="$HOST" ;;
            *) exit 1 ;;
          esac
          staging_root="$(nix-cache-roots stage)"
          nix build "./hosts/$HOST#nixosConfigurations.$output.config.system.build.toplevel" \
            --no-update-lock-file --no-write-lock-file --out-link "$staging_root"
          nix path-info --recursive --closure-size "$staging_root"
          echo "staging-root=$staging_root" >> "$GITHUB_OUTPUT"
      - name: Promote current branch root
        env:
          STAGING_ROOT: ${{ steps.system.outputs.staging-root }}
          NIX_CACHE_JOB_TOKEN: ${{ github.token }}
        run: |
          nix-cache-roots promote --branch "$SOURCE_BRANCH" --host "$HOST" \
            --commit "$SOURCE_SHA" --staging-root "$STAGING_ROOT"
      # Reporting is deliberately AFTER mandatory promotion and never builds a baseline.
      - name: Compare retained target closure (best effort)
        id: report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          STAGING_ROOT: ${{ steps.system.outputs.staging-root }}
          NIX_CACHE_JOB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/nix-input-updates/report.py prepare
      # Forgejo's v3 artifact protocol on native runner 13.2.0, node20 action.
      - name: Upload complete host package change report
        id: artifact
        if: steps.report.outputs.ready == 'true'
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@97a0fba1372883ab732affbe8f94b823f91727db
        with:
          name: host-package-report-${{ matrix.host }}-${{ github.run_attempt }}
          path: .private/tmp/host-package-report/
          if-no-files-found: error
      - name: Publish bot-owned host report (best effort)
        id: comment
        if: steps.report.outputs.ready == 'true' && steps.artifact.outcome == 'success'
        continue-on-error: true
        env:
          NIX_AUTOMATION_TOKEN: ${{ secrets.NIX_AUTOMATION_TOKEN }}
          NIX_AUTOMATION_BOT_ID: ${{ vars.NIX_AUTOMATION_BOT_ID }}
        run: python3 scripts/nix-input-updates/report.py publish
      - name: Warn about reporting infrastructure failures
        if: >-
          !cancelled() && (steps.report.outcome == 'failure' ||
          steps.artifact.outcome == 'failure' || steps.comment.outcome == 'failure')
        run: echo '::warning::Host package change reporting failed; mandatory build/retention result is unchanged. Any earlier PR report is preserved.'
